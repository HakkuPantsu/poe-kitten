<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>POE Kitten — UI Direction Variants</title>
    <style>
      :root {
        --font: "Segoe UI", "Inter", system-ui, -apple-system, sans-serif;
        --mono: "Cascadia Code", "Consolas", ui-monospace, monospace;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: #05060a;
        color: #e7eaf2;
        font-family: var(--font);
        font-size: 13px;
        padding: 28px;
        -webkit-font-smoothing: antialiased;
      }
      h1 { font-size: 15px; font-weight: 600; color: #9aa3b8; margin-bottom: 4px; letter-spacing: .3px; }
      .sub { color: #5f6880; font-size: 12px; margin-bottom: 22px; }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, 470px);
        gap: 26px;
        justify-content: center;
      }
      @media (max-width: 1040px) { .grid { grid-template-columns: 470px; } }

      .variant { display: flex; flex-direction: column; gap: 10px; }
      .vlabel { display: flex; align-items: center; gap: 9px; font-size: 12.5px; font-weight: 700; color: #cdd4e4; }
      .vlabel .tag {
        font-size: 10px; font-weight: 800; letter-spacing: .5px; padding: 2px 7px; border-radius: 5px;
        background: #1b2130; color: #9aa3b8; border: 1px solid #2a3243;
      }
      .vdesc { font-size: 11px; color: #5f6880; margin-left: 2px; }

      /* ============ shared window skeleton ============ */
      .window {
        width: 470px;
        border: 1px solid var(--w-border);
        border-radius: var(--w-radius);
        background: var(--w-bg);
        box-shadow: var(--w-shadow);
        overflow: hidden;
        backdrop-filter: var(--w-blur);
        -webkit-backdrop-filter: var(--w-blur);
        position: relative;
      }
      .titlebar {
        display: flex; align-items: center; gap: 9px; padding: 9px 11px;
        border-bottom: 1px solid var(--w-border);
        background: var(--w-titlebar);
      }
      .logo {
        width: 21px; height: 21px; border-radius: var(--w-radius-sm); display: grid; place-items: center;
        font-size: 11px; background: var(--w-logo-bg); color: var(--w-logo-fg); box-shadow: var(--w-logo-glow);
      }
      .league {
        display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12.5px;
        padding: 3.5px 9px; border-radius: var(--w-pill); background: var(--w-subtle); border: 1px solid var(--w-border);
      }
      .league .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--w-accent-2); box-shadow: 0 0 8px var(--w-accent-2); }
      .lease { color: var(--w-muted-2); }
      .spacer { flex: 1; }
      .rate {
        display: flex; align-items: center; gap: 5px; font-weight: 600; font-size: 12px;
        color: var(--w-accent); background: var(--w-accent-soft); border: 1px solid var(--w-accent-border);
        padding: 3.5px 9px; border-radius: var(--w-pill);
      }
      .icon-btn {
        width: 25px; height: 25px; display: grid; place-items: center; border-radius: var(--w-radius-sm);
        color: var(--w-muted); background: transparent; border: 1px solid transparent; cursor: pointer; font-size: 12px;
      }
      .icon-btn:hover { color: var(--w-text); background: var(--w-subtle); border-color: var(--w-border); }

      .item-head { display: flex; gap: 12px; padding: 13px 13px 11px; }
      .item-icon {
        width: 54px; height: 54px; flex: none; border-radius: var(--w-radius-sm); display: grid; place-items: center;
        font-size: 25px; background: var(--w-icon-bg); border: 1px solid var(--w-border-strong); position: relative;
      }
      .item-icon::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: var(--w-icon-inner); }
      .item-meta { min-width: 0; flex: 1; }
      .item-name { font-size: var(--w-name-size); font-weight: 700; color: var(--w-unique); letter-spacing: .2px; font-family: var(--w-name-font); }
      .item-base { color: var(--w-muted); font-size: 12px; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
      .chip {
        font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: var(--w-pill);
        background: var(--w-subtle); border: 1px solid var(--w-border); color: var(--w-muted);
      }
      .chip.gold { color: var(--w-accent); border-color: var(--w-accent-border); background: var(--w-accent-soft); }

      .price-card {
        margin: 0 13px 12px; border-radius: var(--w-radius-sm); border: 1px solid var(--w-border);
        background: var(--w-pricecard); padding: 13px; display: flex; align-items: center; gap: 15px;
      }
      .price-main { display: flex; align-items: baseline; gap: 7px; }
      .price-main .num { font-size: 29px; font-weight: 800; letter-spacing: -.5px; color: #fff; font-family: var(--w-name-font); }
      .price-main .cur { color: var(--w-accent); font-weight: 700; font-size: 14px; }
      .price-sub { color: var(--w-muted); font-size: 11px; margin-top: 2px; }
      .price-divider { width: 1px; align-self: stretch; background: var(--w-border); }
      .price-alt { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; color: var(--w-muted); }
      .price-alt b { color: var(--w-text); font-weight: 600; }

      .search-row { display: flex; gap: 8px; padding: 0 13px 11px; }
      .search-box {
        flex: 1; display: flex; align-items: center; gap: 8px; background: var(--w-input); border: 1px solid var(--w-border);
        border-radius: var(--w-radius-sm); padding: 0 10px; height: 37px; color: var(--w-muted);
      }
      .search-box input { flex: 1; background: transparent; border: 0; outline: 0; color: var(--w-text); font: inherit; }
      .btn {
        height: 37px; padding: 0 15px; border-radius: var(--w-radius-sm); border: 1px solid var(--w-border-strong);
        background: var(--w-subtle); color: var(--w-text); font: inherit; font-weight: 600; cursor: pointer;
        display: inline-flex; align-items: center; gap: 7px;
      }
      .btn.primary { background: var(--w-primary-bg); border-color: var(--w-primary-border); color: var(--w-primary-fg); box-shadow: var(--w-primary-glow); }

      .toggles { display: flex; gap: 6px; padding: 0 13px 11px; flex-wrap: wrap; }
      .toggle {
        font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: var(--w-pill);
        border: 1px solid var(--w-border); background: var(--w-subtle); color: var(--w-muted); cursor: pointer;
      }
      .toggle.on { color: var(--w-accent-3); border-color: var(--w-accent-3-border); background: var(--w-accent-3-soft); }

      .section-label {
        display: flex; align-items: center; gap: 8px; padding: 0 13px 7px; color: var(--w-muted-2);
        font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.1px;
      }
      .section-label::after { content: ""; flex: 1; height: 1px; background: var(--w-border); }
      .mods { padding: 0 13px 11px; display: flex; flex-direction: column; gap: 4px; }
      .mod { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--w-text-soft); }
      .mod .tier {
        flex: none; font-size: 9.5px; font-weight: 800; padding: 1px 6px; border-radius: 5px;
        background: var(--w-accent-soft); color: var(--w-accent); border: 1px solid var(--w-accent-border);
      }
      .mod .tier.t2 { background: var(--w-accent-3-soft); color: var(--w-accent-3); border-color: var(--w-accent-3-border); }
      .mod .val { color: var(--w-accent-3); font-weight: 600; }

      .listings { border-top: 1px solid var(--w-border); background: var(--w-listings-bg); }
      .lhead, .lrow { display: grid; grid-template-columns: 92px 1fr 52px 56px; gap: 9px; padding: 8px 14px; align-items: center; }
      .lhead {
        font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: var(--w-muted-2); font-weight: 700;
        border-bottom: 1px solid var(--w-border);
      }
      .lrow { border-bottom: 1px solid var(--w-row-line); }
      .lrow:hover { background: var(--w-row-hover); }
      .lrow .p { font-weight: 700; color: #fff; display: flex; align-items: center; gap: 5px; font-family: var(--w-num-font); }
      .lrow .orb { width: 13px; height: 13px; border-radius: 50%; flex: none; background: radial-gradient(circle at 35% 30%, #fff6d8, #d9a441 55%, #7a5216); }
      .lrow .orb.ex { background: radial-gradient(circle at 35% 30%, #e6d4ff, #a06bff 55%, #4a2a80); }
      .lrow .seller { color: var(--w-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .lrow .seller .rank { color: var(--w-accent-2); font-weight: 700; }
      .lrow .stock { color: var(--w-muted); text-align: center; }
      .lrow .age { color: var(--w-muted-2); text-align: right; font-size: 11px; }
      .best { background: var(--w-best-bg); }
      .best .p { color: var(--w-accent); }
      .badge-best { font-size: 9px; font-weight: 800; letter-spacing: .5px; padding: 1px 5px; border-radius: 4px; background: var(--w-accent); color: #17110a; }
      .footer { display: flex; align-items: center; gap: 7px; padding: 8px 14px; color: var(--w-muted-2); font-size: 10.5px; }
      .footer .k { background: var(--w-subtle); border: 1px solid var(--w-border); border-radius: 5px; padding: 1px 6px; color: var(--w-muted); font-weight: 600; }
      .footer .ok { color: var(--w-accent-2); font-weight: 700; }

      /* ============ A: sleek dark glass ============ */
      [data-v="glass"] {
        --w-bg: rgba(19, 23, 34, 0.82); --w-border: rgba(255,255,255,.08); --w-border-strong: rgba(255,255,255,.14);
        --w-radius: 16px; --w-radius-sm: 8px; --w-text: #e7eaf2; --w-text-soft: #cfd5e4; --w-muted: #8b93a7; --w-muted-2: #616981;
        --w-accent: #e0a94a; --w-accent-soft: rgba(224,169,74,.14); --w-accent-border: rgba(224,169,74,.3);
        --w-accent-2: #55c98a; --w-accent-3: #6ea8fe; --w-accent-3-soft: rgba(110,168,254,.14); --w-accent-3-border: rgba(110,168,254,.45);
        --w-unique: #d1823c; --w-subtle: #171c28; --w-input: #12161f; --w-titlebar: linear-gradient(180deg, rgba(255,255,255,.03), transparent);
        --w-blur: blur(22px) saturate(140%);
        --w-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 30px 70px -20px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.04);
        --w-logo-bg: linear-gradient(140deg, #e0a94a, #8a5a1e); --w-logo-fg: #1a1205; --w-logo-glow: 0 0 14px rgba(224,169,74,.35);
        --w-pill: 999px; --w-icon-bg: linear-gradient(150deg,#2a2138,#16121f); --w-icon-inner: inset 0 0 22px rgba(209,130,60,.25);
        --w-pricecard: linear-gradient(135deg, rgba(224,169,74,.1), transparent 45%), #171c28;
        --w-primary-bg: linear-gradient(180deg,#7db2ff,#5b8fe6); --w-primary-border: #86b7ff; --w-primary-fg: #0a1526; --w-primary-glow: 0 6px 18px -6px rgba(110,168,254,.7);
        --w-listings-bg: rgba(0,0,0,.18); --w-row-line: rgba(255,255,255,.035); --w-row-hover: rgba(110,168,254,.06); --w-best-bg: rgba(224,169,74,.06);
        --w-name-size: 16px; --w-name-font: var(--font); --w-num-font: var(--font);
      }

      /* ============ B: minimal flat dark ============ */
      [data-v="flat"] {
        --w-bg: #0f1116; --w-border: #232833; --w-border-strong: #2f3644;
        --w-radius: 8px; --w-radius-sm: 6px; --w-text: #eef1f6; --w-text-soft: #c8cedb; --w-muted: #8a92a3; --w-muted-2: #5d6475;
        --w-accent: #e6b34e; --w-accent-soft: rgba(230,179,78,.1); --w-accent-border: #3a3220;
        --w-accent-2: #4fd1a5; --w-accent-3: #57d1ff; --w-accent-3-soft: rgba(87,209,255,.1); --w-accent-3-border: #1d3a49;
        --w-unique: #cf8438; --w-subtle: #171a21; --w-input: #0b0d12; --w-titlebar: #12151c;
        --w-blur: none;
        --w-shadow: 0 18px 40px -18px rgba(0,0,0,.9);
        --w-logo-bg: #e6b34e; --w-logo-fg: #12151c; --w-logo-glow: none;
        --w-pill: 8px; --w-icon-bg: #171a21; --w-icon-inner: inset 0 0 0 1px #232833;
        --w-pricecard: #12151c;
        --w-primary-bg: #57d1ff; --w-primary-border: #57d1ff; --w-primary-fg: #06131a; --w-primary-glow: none;
        --w-listings-bg: #0c0e13; --w-row-line: #1b1f28; --w-row-hover: rgba(87,209,255,.07); --w-best-bg: rgba(230,179,78,.05);
        --w-name-size: 15.5px; --w-name-font: var(--font); --w-num-font: var(--mono);
      }
      [data-v="flat"] .mod .tier { border-radius: 4px; }
      [data-v="flat"] .btn.primary { font-weight: 700; }

      /* ============ C: PoE ember fantasy ============ */
      [data-v="ember"] {
        --w-bg: linear-gradient(180deg, #171009, #0d0906); --w-border: #4a3520; --w-border-strong: #6b4c2a;
        --w-radius: 4px; --w-radius-sm: 3px; --w-text: #f2e6d2; --w-text-soft: #dcc9ab; --w-muted: #a08a6c; --w-muted-2: #77613f;
        --w-accent: #e8b558; --w-accent-soft: rgba(232,181,88,.12); --w-accent-border: #6b4c2a;
        --w-accent-2: #9bd06a; --w-accent-3: #e8a94a; --w-accent-3-soft: rgba(232,169,74,.12); --w-accent-3-border: #6b4c2a;
        --w-unique: #e0912f; --w-subtle: #221709; --w-input: #120c07; --w-titlebar: linear-gradient(180deg,#2a1c0e,#170f08);
        --w-blur: none;
        --w-shadow: 0 0 0 1px #2a1c0e, 0 24px 60px -20px rgba(0,0,0,.95), inset 0 0 60px rgba(232,169,74,.05);
        --w-logo-bg: linear-gradient(140deg,#e8b558,#8a5a1e); --w-logo-fg: #1a1205; --w-logo-glow: 0 0 16px rgba(232,169,74,.5);
        --w-pill: 3px; --w-icon-bg: radial-gradient(circle at 50% 30%,#3a2814,#160f08); --w-icon-inner: inset 0 0 26px rgba(232,169,74,.28);
        --w-pricecard: linear-gradient(180deg, rgba(232,169,74,.12), rgba(232,169,74,.02)), #1a1209;
        --w-primary-bg: linear-gradient(180deg,#e8b558,#b9832c); --w-primary-border: #f0c977; --w-primary-fg: #201502; --w-primary-glow: 0 6px 20px -6px rgba(232,169,74,.6);
        --w-listings-bg: rgba(0,0,0,.3); --w-row-line: rgba(232,169,74,.09); --w-row-hover: rgba(232,169,74,.07); --w-best-bg: rgba(232,169,74,.08);
        --w-name-size: 17px; --w-name-font: Georgia, "Times New Roman", serif; --w-num-font: Georgia, serif;
      }
      [data-v="ember"] .window { border-width: 1px; }
      [data-v="ember"] .window::before {
        content: ""; position: absolute; inset: 4px; border: 1px solid rgba(232,169,74,.18); border-radius: 2px; pointer-events: none;
      }
      [data-v="ember"] .titlebar { border-bottom-width: 1px; }
      [data-v="ember"] .item-name { text-shadow: 0 0 14px rgba(224,145,47,.4); }

      /* ============ D: arcane neon ============ */
      [data-v="arcane"] {
        --w-bg: rgba(14,12,26,.85); --w-border: rgba(150,130,255,.16); --w-border-strong: rgba(170,150,255,.3);
        --w-radius: 14px; --w-radius-sm: 8px; --w-text: #eae7fb; --w-text-soft: #c8c2ea; --w-muted: #8b84b0; --w-muted-2: #625c88;
        --w-accent: #c08cff; --w-accent-soft: rgba(192,140,255,.14); --w-accent-border: rgba(192,140,255,.35);
        --w-accent-2: #4fe0c8; --w-accent-3: #4fc8ff; --w-accent-3-soft: rgba(79,200,255,.12); --w-accent-3-border: rgba(79,200,255,.4);
        --w-unique: #d1823c; --w-subtle: #191634; --w-input: #100e22; --w-titlebar: linear-gradient(180deg, rgba(150,130,255,.07), transparent);
        --w-blur: blur(20px) saturate(150%);
        --w-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 30px 70px -20px #000, 0 0 40px -10px rgba(150,130,255,.25), inset 0 1px 0 rgba(255,255,255,.05);
        --w-logo-bg: linear-gradient(140deg,#c08cff,#4fc8ff); --w-logo-fg: #0b0a1a; --w-logo-glow: 0 0 16px rgba(160,130,255,.6);
        --w-pill: 999px; --w-icon-bg: linear-gradient(150deg,#241f45,#120f27); --w-icon-inner: inset 0 0 24px rgba(160,130,255,.3);
        --w-pricecard: linear-gradient(135deg, rgba(192,140,255,.12), rgba(79,200,255,.06) 60%, transparent), #171430;
        --w-primary-bg: linear-gradient(180deg,#b98cff,#7a5ce0); --w-primary-border: #c9a6ff; --w-primary-fg: #0b0a1a; --w-primary-glow: 0 6px 20px -6px rgba(160,130,255,.8);
        --w-listings-bg: rgba(0,0,0,.22); --w-row-line: rgba(150,130,255,.1); --w-row-hover: rgba(160,130,255,.08); --w-best-bg: rgba(192,140,255,.08);
        --w-name-size: 16px; --w-name-font: var(--font); --w-num-font: var(--font);
      }
      [data-v="arcane"] .item-name { text-shadow: 0 0 16px rgba(192,140,255,.45); }
    </style>
  </head>
  <body>
    <h1>POE Kitten — pick a direction</h1>
    <div class="sub">Same layout &amp; one-click ⚡ Search in all four. Only the visual language changes.</div>

    <div class="grid" id="grid"></div>

    <template id="window-tpl">
      <div class="window">
        <div class="titlebar">
          <div class="logo">◆</div>
          <div class="league"><span class="dot"></span> Dawn of the Hunt <span class="lease">▾</span></div>
          <div class="spacer"></div>
          <div class="rate">✦ 1 div = 214 ex</div>
          <button class="icon-btn">⚙</button>
          <button class="icon-btn">✕</button>
        </div>
        <div class="item-head">
          <div class="item-icon">🗡</div>
          <div class="item-meta">
            <div class="item-name">Mahuxotl's Machination</div>
            <div class="item-base">Omen Crest Shield · iLvl 82</div>
            <div class="chips">
              <span class="chip gold">Unique</span>
              <span class="chip">Quality +20%</span>
              <span class="chip">Corrupted</span>
            </div>
          </div>
        </div>
        <div class="price-card">
          <div>
            <div class="price-main"><span class="num">3.2</span><span class="cur">Divine Orb</span></div>
            <div class="price-sub">Median of 24 listings · updated just now</div>
          </div>
          <div class="price-divider"></div>
          <div class="price-alt">
            <div>≈ <b>685</b> Exalted</div>
            <div>≈ <b>12.4</b> Chaos</div>
            <div style="color: var(--w-accent-2)">▼ 4.1% vs 7d</div>
          </div>
        </div>
        <div class="search-row">
          <div class="search-box"><span>🔍</span><input value="Mahuxotl's Machination" spellcheck="false" /></div>
          <button class="btn primary">⚡ Search</button>
        </div>
        <div class="toggles">
          <span class="toggle on">Instant search</span>
          <span class="toggle on">Online only</span>
          <span class="toggle">Buyout</span>
          <span class="toggle">Exact base</span>
        </div>
        <div class="section-label">Modifiers</div>
        <div class="mods">
          <div class="mod"><span class="tier">T1</span> +<span class="val">34%</span> to all Elemental Resistances</div>
          <div class="mod"><span class="tier t2">T2</span> +<span class="val">86</span> to maximum Energy Shield</div>
          <div class="mod"><span class="tier">T1</span> <span class="val">+2</span> to Level of all Skill Gems</div>
        </div>
        <div class="listings">
          <div class="lhead"><span>Price</span><span>Seller</span><span>Stock</span><span style="text-align:right">Listed</span></div>
          <div class="lrow best">
            <div class="p"><span class="orb"></span>2.9 div <span class="badge-best">BEST</span></div>
            <div class="seller"><span class="rank">#1</span> Exile_Vaal</div>
            <div class="stock">1</div><div class="age">6m</div>
          </div>
          <div class="lrow">
            <div class="p"><span class="orb"></span>3.1 div</div>
            <div class="seller"><span class="rank">#3</span> ChaosGambler</div>
            <div class="stock">2</div><div class="age">22m</div>
          </div>
          <div class="lrow">
            <div class="p"><span class="orb ex"></span>672 ex</div>
            <div class="seller"><span class="rank">#8</span> WraeclastWind</div>
            <div class="stock">1</div><div class="age">51m</div>
          </div>
        </div>
        <div class="footer">
          <span class="k">Ctrl</span>+<span class="k">D</span> check hovered item
          <span style="flex:1"></span><span class="ok">⚡ 0.8s</span>
        </div>
      </div>
    </template>

    <script>
      const variants = [
        { v: "glass", tag: "A", name: "Sleek Dark Glass", desc: "Glassy panels, ember + blue accents, soft glow. Modern & polished." },
        { v: "flat", tag: "B", name: "Minimal Flat Dark", desc: "No blur/glow, hairline borders, mono numbers. Max readability, cheapest to render." },
        { v: "ember", tag: "C", name: "PoE Ember Fantasy", desc: "Warm charcoal + ornate gold borders, serif display. Closest to Path of Exile." },
        { v: "arcane", tag: "D", name: "Arcane Neon", desc: "Deep indigo glass with violet/cyan neon. Gaming-forward." },
      ];
      const grid = document.getElementById("grid");
      const tpl = document.getElementById("window-tpl");
      for (const it of variants) {
        const wrap = document.createElement("div");
        wrap.className = "variant";
        wrap.setAttribute("data-v", it.v);
        const label = document.createElement("div");
        label.innerHTML = `<span class="tag">${it.tag}</span><span>${it.name}</span>`;
        label.className = "vlabel";
        const desc = document.createElement("div");
        desc.className = "vdesc";
        desc.textContent = it.desc;
        wrap.appendChild(label);
        wrap.appendChild(desc);
        wrap.appendChild(tpl.content.cloneNode(true));
        grid.appendChild(wrap);
      }
    </script>
  </body>
</html>
