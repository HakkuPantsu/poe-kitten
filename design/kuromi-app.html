<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exiled Kitty 2 — Kuromi Mode · All Surfaces</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --font: "Fredoka", "Baloo 2", "Comic Sans MS", "Segoe UI", sans-serif;
        --disp: "Baloo 2", "Fredoka", "Comic Sans MS", cursive;
        --mono: "Cascadia Code", ui-monospace, monospace;

        --page-bg: radial-gradient(1200px 700px at 85% -10%, rgba(199,125,255,.16), transparent 60%),
          radial-gradient(1000px 600px at -5% 110%, rgba(255,95,176,.12), transparent 60%),
          linear-gradient(160deg, #221830, #171122 55%, #241a2e);
        --win-bg: #241a2e; --win-border: #7a3fb0; --win-border-soft: #4a2f6a;
        --text: #f2e6ff; --text-soft: #c9a8e8; --muted: #9a7fc4; --muted-2: #6f5a94;
        --accent: #ff5fb0; --accent2: #c77dff; --accent3: #ffd166;
        --glow: rgba(199,125,255,.6); --glow-pink: rgba(255,95,176,.55);
        --panel: #2e2140; --panel-2: #271a36; --input: #1d1430;
        --row-line: #3a2a52; --row-hover: #33244a; --row-alt: #291c3a; --best-bg: #3a2450;
        --primary-grad: linear-gradient(135deg, #a855f7, #ff5fb0);
        --holo: linear-gradient(120deg, #3a2450, #4a2a68 35%, #5a2a58 65%, #3a2450);
        --unique: #e0a94a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: var(--font); color: var(--text); background: var(--page-bg); background-attachment: fixed;
        padding: 28px 24px 70px; -webkit-font-smoothing: antialiased; min-height: 100vh;
      }
      .head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
      .head h1 { font-family: var(--disp); font-size: 25px; font-weight: 800; color: #e0a8ff; text-shadow: 0 0 18px var(--glow); letter-spacing: .4px; }
      .head .kit { font-size: 26px; animation: wobble 3s ease-in-out infinite; display: inline-block; }
      @keyframes wobble { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg) scale(1.08); } }
      .hint { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
      .hint b { color: var(--accent2); }

      .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 26px; align-items: start; }
      .card { display: flex; flex-direction: column; gap: 10px; }
      .card.wide { grid-column: 1 / -1; }
      .card.wide .surface { max-width: 640px; margin-inline: auto; }
      @media (min-width: 1200px) { .card.span2 { grid-column: span 2; } }
      .cap { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 700; color: #d9c0f5; }
      .cap .tag { font-size: 10px; font-weight: 800; letter-spacing: .5px; padding: 2px 8px; border-radius: 999px; background: var(--primary-grad); color: #fff; }

      /* generic surface chrome */
      .surface { border: 2px solid var(--win-border); border-radius: 18px; background: var(--win-bg); box-shadow: 0 24px 60px -26px #000, 0 0 30px -14px var(--glow); overflow: hidden; position: relative; }
      .surface.holo::after { content: ""; position: absolute; inset: 0; border-radius: 16px; pointer-events: none; box-shadow: inset 0 0 60px rgba(199,125,255,.08); }

      .bar { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 2px dashed var(--win-border); background: var(--panel-2); }
      .bar .logo { display: none; }
      .bar .title { font-family: var(--disp); font-weight: 800; font-size: 15px; letter-spacing: .3px; background: linear-gradient(90deg, #e0a8ff, #ff8fd0); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .bar .spacer { flex: 1; }
      .bar .pill { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--panel); border: 2px solid var(--win-border-soft); color: var(--text-soft); }
      .bar .ibtn { width: 26px; height: 26px; border-radius: 9px; display: grid; place-items: center; background: transparent; border: 2px solid transparent; color: var(--muted); font-size: 12px; cursor: pointer; transition: .15s; }
      .bar .ibtn:hover { background: var(--panel); border-color: var(--win-border-soft); color: var(--text); }

      .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
      .dot.on { background: #59d97a; box-shadow: 0 0 8px #59d97a; animation: pulse 1.8s ease-in-out infinite; }
      .dot.off { background: #ff5f5f; }
      .dot.afk { background: #ffb84d; }
      @keyframes pulse { 50% { opacity: .4; transform: scale(.72); } }

      .btn { height: 34px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--win-border-soft); background: var(--panel); color: var(--text); font: inherit; font-weight: 700; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
      .btn.primary { background: var(--primary-grad); border-color: transparent; color: #fff; box-shadow: 0 6px 16px -5px var(--glow-pink); }
      .input { background: var(--input); border: 2px solid var(--win-border-soft); border-radius: 999px; height: 34px; padding: 0 13px; color: var(--text); font: inherit; font-size: 12.5px; display: flex; align-items: center; gap: 7px; }
      .chip { font-size: 11px; font-weight: 700; padding: 4px 11px; border-radius: 999px; background: var(--panel); border: 2px solid var(--win-border-soft); color: var(--muted); }
      .chip.on { background: var(--primary-grad); border-color: transparent; color: #fff; }
      .label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted-2); }

      /* sparkles */
      .spark { position: absolute; font-size: 12px; animation: twinkle 1.8s ease-in-out infinite; }
      @keyframes twinkle { 0%,100% { opacity: .15; transform: scale(.6) rotate(0); } 50% { opacity: 1; transform: scale(1.15) rotate(20deg); } }
      @keyframes bob { 50% { transform: translateY(-3px); } }
      @keyframes beat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }

      /* ---------- price check ---------- */
      .item-head { display: flex; gap: 12px; padding: 14px; }
      .item-icon { width: 62px; height: 62px; flex: none; border-radius: 16px; display: grid; place-items: center; padding: 6px; font-size: 26px; background: var(--panel); border: 2px solid var(--win-border-soft); position: relative; animation: bob 3.4s ease-in-out infinite; }
      .item-icon img { width: 100%; height: 100%; object-fit: contain; display: block; filter: drop-shadow(0 3px 6px rgba(0,0,0,.5)); }
      .item-icon::after { content: "♡"; position: absolute; top: -8px; right: -8px; font-size: 14px; color: var(--accent); animation: beat 2s ease-in-out infinite; }
      .item-name { font-family: var(--disp); font-size: 18px; font-weight: 800; color: var(--unique); }
      .item-base { color: var(--muted); font-size: 12px; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
      .price-card { position: relative; overflow: hidden; margin: 0 14px 12px; border-radius: 16px; border: 2px solid var(--win-border-soft); background: var(--holo); background-size: 200% 200%; padding: 14px 15px; display: flex; align-items: center; gap: 15px; animation: holo 6s ease infinite, breath 3.2s ease-in-out infinite; }
      @keyframes holo { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
      @keyframes breath { 0%,100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 28px -4px var(--glow); } }
      .price-card .num { font-family: var(--disp); font-size: 32px; font-weight: 800; color: #fff; text-shadow: 0 2px 0 var(--accent2), 0 0 16px var(--glow); }
      .price-card .cur { font-weight: 700; font-size: 14px; color: var(--text-soft); }
      .price-sub { color: var(--text-soft); font-size: 11px; margin-top: 2px; }
      .price-div { width: 2px; align-self: stretch; background: var(--win-border-soft); border-radius: 2px; }
      .price-alt { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; color: var(--text-soft); font-weight: 600; }
      .price-alt b { color: var(--text); }
      .search-row { display: flex; gap: 8px; padding: 0 14px 11px; }
      .search-row .input { flex: 1; }
      .toggles { display: flex; gap: 6px; padding: 0 14px 11px; flex-wrap: wrap; }
      .mods { padding: 0 14px 12px; display: flex; flex-direction: column; gap: 5px; }
      .mod { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-soft); }
      .tier { flex: none; font-size: 9.5px; font-weight: 800; padding: 2px 7px; border-radius: 8px; background: var(--primary-grad); color: #fff; }
      .tier.t2 { background: var(--accent2); }
      .val { color: var(--accent); font-weight: 700; }
      .star { color: var(--accent3); }
      .listings { border-top: 2px dashed var(--win-border); background: var(--panel-2); }
      .lhead, .lrow { display: grid; grid-template-columns: 16px 94px 1fr 44px 50px 52px; gap: 9px; padding: 8px 14px; align-items: center; }
      .lhead { font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted-2); font-weight: 800; }
      .lrow { border-bottom: 1px solid var(--row-line); position: relative; }
      .lrow.alt { background: var(--row-alt); }
      .lrow .p { font-weight: 700; font-family: var(--disp); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
      .mark { font-size: 12px; text-align: center; line-height: 1; color: var(--accent3); }
      /* best row: leading gradient rail + soft wash — no inline badge squashing the price */
      .lrow.best { background: linear-gradient(90deg, rgba(199,125,255,.16), var(--best-bg) 45%); }
      .lrow.best::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--primary-grad); }
      .lrow.best .p { color: var(--accent); }
      .besttag { justify-self: end; font-size: 9px; font-weight: 800; letter-spacing: .7px; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 2px 7px; background: rgba(255,95,176,.12); }
      .orb { width: 13px; height: 13px; border-radius: 50%; flex: none; background: radial-gradient(circle at 35% 30%, #fff6d8, #d9a441 55%, #7a5216); }
      .orb.ex { background: radial-gradient(circle at 35% 30%, #e6d4ff, #a06bff 55%, #4a2a80); }
      .seller { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .seller .rank { color: var(--accent2); font-weight: 700; }
      .stock { color: var(--muted); text-align: center; }
      .age { color: var(--muted-2); text-align: right; font-size: 11px; }
      .foot { display: flex; align-items: center; gap: 6px; padding: 8px 14px; color: var(--muted); font-size: 10.5px; font-weight: 600; }
      .k { background: var(--panel); border: 2px solid var(--win-border-soft); border-radius: 6px; padding: 1px 7px; color: var(--text-soft); font-weight: 700; }

      /* ---------- item search ---------- */
      .pad { padding: 13px; display: flex; flex-direction: column; gap: 9px; }
      .starred { display: flex; gap: 7px; flex-wrap: wrap; }
      .staritem { display: flex; flex-direction: column; align-items: center; gap: 3px; background: var(--panel); border: 2px solid var(--win-border-soft); border-radius: 14px; padding: 7px 10px; min-width: 78px; }
      .staritem .ic, .res .ic { width: 44px; height: 44px; display: grid; place-items: center; padding: 4px; font-size: 16px; background: var(--input); }
      .staritem .ic { border-radius: 11px; }
      .staritem .ic img, .res .ic img { width: 100%; height: 100%; object-fit: contain; display: block; }
      .staritem .nm { font-size: 10.5px; color: var(--text-soft); font-weight: 600; max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .staritem .pr { font-size: 11px; font-weight: 800; color: var(--accent3); }
      .reslist { display: flex; flex-direction: column; }
      .res { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--row-line); }
      .res:hover { background: var(--row-hover); }
      .res .ic { flex: none; border-radius: 10px; border: 2px solid var(--win-border-soft); }
      .res .nm { flex: 1; font-size: 12.5px; }
      .res .nm small { display: block; color: var(--muted); font-size: 10.5px; }
      .res .go { font-size: 11px; font-weight: 700; color: var(--accent); }

      /* ---------- trade listings ---------- */
      .trade-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--row-line); }
      .matched { font-size: 12px; color: var(--muted); }
      .matched b { color: var(--text); font-family: var(--disp); font-size: 14px; }
      .th, .tr { display: grid; grid-template-columns: 1fr .5fr .6fr 1.9fr; gap: 8px; padding: 8px 14px; align-items: center; }
      .th { font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted-2); font-weight: 800; border-bottom: 1px solid var(--row-line); }
      .tr { border-bottom: 1px solid var(--row-line); font-size: 12.5px; }
      .tr.alt { background: var(--row-alt); }
      .tr .seller { display: flex; align-items: center; gap: 7px; min-width: 0; overflow: visible; }
      .tr .seller .sname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tr .whisper { flex: none; white-space: nowrap; font-size: 10px; font-weight: 700; color: var(--accent2); border: 2px solid var(--win-border-soft); border-radius: 999px; padding: 2px 8px; }
      .notice { margin: 10px 14px; padding: 9px 12px; border: 2px dashed var(--accent3); border-radius: 12px; color: var(--accent3); font-size: 11.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; }

      /* ---------- filters ---------- */
      .presets { display: flex; gap: 6px; padding: 11px 13px 6px; }
      .filter { display: grid; grid-template-columns: 22px 1fr 120px 62px; gap: 9px; align-items: center; padding: 9px 13px; border-bottom: 1px solid var(--row-line); }
      .filter:hover { background: var(--row-hover); }
      .cbox { width: 18px; height: 18px; border-radius: 6px; border: 2px solid var(--win-border-soft); display: grid; place-items: center; font-size: 10px; color: #fff; }
      .cbox.on { background: var(--primary-grad); border-color: transparent; }
      .ftext { font-size: 12.5px; color: var(--text-soft); }
      .ftext .tier { margin-right: 6px; }
      .slider { height: 6px; border-radius: 999px; background: var(--input); position: relative; }
      .slider::before { content: ""; position: absolute; left: 18%; right: 22%; top: 0; bottom: 0; background: var(--primary-grad); border-radius: 999px; }
      .slider i { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: #fff; transform: translate(-50%,-50%); box-shadow: 0 0 8px var(--glow); }
      .numin { display: flex; gap: 4px; }
      .numin span { flex: 1; text-align: center; background: var(--input); border: 2px solid var(--win-border-soft); border-radius: 8px; font-size: 11px; padding: 3px 0; color: var(--text-soft); font-family: var(--mono); }

      /* ---------- settings ---------- */
      .set-body { display: flex; min-height: 340px; }
      .sidebar { width: 168px; flex: none; border-right: 2px dashed var(--win-border); padding: 10px 8px; display: flex; flex-direction: column; gap: 3px; }
      .smitem { text-align: left; font: inherit; font-size: 12.5px; font-weight: 600; color: var(--muted); background: transparent; border: 2px solid transparent; border-radius: 11px; padding: 8px 11px; cursor: pointer; }
      .smitem:hover { color: var(--text); }
      .smitem.active { color: #fff; background: var(--primary-grad); box-shadow: 0 4px 12px -4px var(--glow-pink); }
      .smitem.quit { margin-top: auto; color: #ff8fb0; border-color: var(--win-border-soft); }
      .content { flex: 1; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
      .content h3 { font-family: var(--disp); font-size: 16px; color: var(--text); }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--row-line); }
      .row .rt { font-size: 12.5px; }
      .row .rt small { display: block; color: var(--muted); font-size: 10.5px; }
      .sw-toggle { width: 44px; height: 24px; border-radius: 999px; background: var(--input); border: 2px solid var(--win-border-soft); position: relative; }
      .sw-toggle i { position: absolute; top: 1px; left: 1px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: .2s; }
      .sw-toggle.on { background: var(--primary-grad); border-color: transparent; }
      .sw-toggle.on i { left: 21px; background: #fff; }
      .set-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 11px 16px; border-top: 2px dashed var(--win-border); background: var(--panel-2); }

      /* ---------- xp tracker ---------- */
      .xp { display: flex; gap: 12px; align-items: center; padding: 13px 16px; }
      .xp .lvl { font-family: var(--disp); font-size: 26px; font-weight: 800; color: #fff; text-shadow: 0 0 14px var(--glow); }
      .xp .lvl small { display: block; font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: 1px; }
      .xp .meter { flex: 1; }
      .xp .track { height: 12px; border-radius: 999px; background: var(--input); border: 2px solid var(--win-border-soft); overflow: hidden; }
      .xp .fill { height: 100%; width: 68%; background: var(--primary-grad); border-radius: 999px; position: relative; }
      .xp .fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent); transform: translateX(-100%); animation: shimmer 2.4s ease-in-out infinite; }
      @keyframes shimmer { to { transform: translateX(100%); } }
      .xp .meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; font-weight: 600; }
      .xp .meta b { color: var(--text-soft); }

      /* ---------- tools menu ---------- */
      .tools { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px; align-items: center; }
      .tool { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 2px solid var(--win-border-soft); border-radius: 14px; padding: 9px 13px; font-size: 12.5px; font-weight: 700; color: var(--text); }
      .tool .ic { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--primary-grad); font-size: 13px; }
      .tool.on { border-color: var(--accent); box-shadow: 0 0 16px -6px var(--glow-pink); }
      .tool .more { color: var(--muted); letter-spacing: 2px; }
    </style>
  </head>
  <body>
    <div class="head"><span class="kit">🖤</span><h1>Exiled Kitty 2 · Kuromi Mode</h1></div>
    <div class="hint">All main surfaces in one language. Motion is <b>expressive</b> — sparkles, bobs, holo shine &amp; beating badges.</div>

    <div class="gallery">
      <!-- PRICE CHECK -->
      <figure class="card wide">
        <figcaption class="cap"><span class="tag">01</span> Price Check — the headline overlay</figcaption>
        <div class="surface">
          <span class="spark" style="top: 70px; right: 20px">✨</span>
          <div class="bar">
            <div class="logo">🎀</div>
            <div class="pill"><span class="dot on"></span>&nbsp;Dawn of the Hunt ▾</div>
            <div class="spacer"></div>
            <div class="pill" style="color:#fff;background:var(--primary-grad);border-color:transparent">✦ 1 div = 214 ex</div>
            <div class="ibtn">⚙</div><div class="ibtn">✕</div>
          </div>
          <div class="item-head">
            <div class="item-icon"><img src="https://web.poecdn.com/gen/image/WzksMTQseyJmIjoiMkRJdGVtcy9GbGFza3MvVW5pcXVlcy9NZWx0aW5nTWFlbHN0cm9tIiwidyI6MSwiaCI6Miwic2NhbGUiOjEsInJlYWxtIjoicG9lMiIsImxldmVsIjoxfV0/3ffec91606/MeltingMaelstrom.png" alt="Melting Maelstrom" /></div>
            <div>
              <div class="item-name">Melting Maelstrom</div>
              <div class="item-base">Ultimate Mana Flask · iLvl 82</div>
              <div class="chips"><span class="chip on">Unique ♡</span><span class="chip">Quality +20%</span><span class="chip">Corrupted</span></div>
            </div>
          </div>
          <div class="price-card">
            <div>
              <div style="display:flex;align-items:baseline;gap:7px"><span class="num">3.2</span><span class="cur">Divine Orb</span></div>
              <div class="price-sub">Median of 24 listings · updated just now</div>
            </div>
            <div class="price-div"></div>
            <div class="price-alt"><div>≈ <b>685</b> Exalted</div><div>≈ <b>12.4</b> Chaos</div><div style="color:#59d97a">▼ 4.1% vs 7d</div></div>
          </div>
          <div class="search-row">
            <div class="input">🔍 <span style="flex:1;color:var(--text)">Melting Maelstrom</span></div>
            <button class="btn primary">⚡ Search</button>
          </div>
          <div class="toggles">
            <span class="chip on">♡ Instant search</span><span class="chip on">✦ Online only</span><span class="chip">Buyout</span><span class="chip">Exact base</span>
          </div>
          <div style="padding:0 14px 8px" class="label">Modifiers ♡</div>
          <div class="mods">
            <div class="mod"><span class="star">★</span><span class="tier">T1</span> Recover <span class="val">25%</span> of Mana when used</div>
            <div class="mod"><span class="star">★</span><span class="tier t2">T2</span> <span class="val">+34%</span> to Mana Recovery Rate</div>
            <div class="mod"><span class="star">★</span><span class="tier">T1</span> Gain <span class="val">15</span> Mana per second</div>
          </div>
          <div class="listings">
            <div class="lhead"><span></span><span>Price</span><span>Seller</span><span>Stock</span><span style="text-align:right">Listed</span><span></span></div>
            <div class="lrow best">
              <div class="mark">★</div>
              <div class="p"><span class="orb"></span>2.9 div</div>
              <div class="seller"><span class="rank">#1</span> Exile_Vaal</div>
              <div class="stock">1</div><div class="age">6m</div>
              <div class="besttag">BEST</div>
            </div>
