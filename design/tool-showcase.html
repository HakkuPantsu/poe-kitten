<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>POE Kitten — Tool Showcase</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --font: "Fredoka", "Baloo 2", "Comic Sans MS", "Segoe UI", sans-serif;
        --disp: "Baloo 2", "Fredoka", "Comic Sans MS", cursive;
        --mono: "Cascadia Code", ui-monospace, monospace;

        --page-bg: radial-gradient(1200px 700px at 85% -10%, rgba(199,125,255,.16), transparent 60%),
          radial-gradient(1000px 600px at -5% 110%, rgba(255,95,176,.12), transparent 60%),
          linear-gradient(160deg, #221830, #171122 55%, #241a2e);
        --win-bg: #241a2e; --win-border: #7a3fb0; --win-border-soft: #4a2f6a;
        --text: #f2e6ff; --text-soft: #c9a8e8; --muted: #9a7fc4; --muted-2: #6f5a94;
        --accent: #ff5fb0; --accent2: #c77dff; --accent3: #ffd166;
        --glow: rgba(199,125,255,.6); --glow-pink: rgba(255,95,176,.55);
        --panel: #2e2140; --panel-2: #271a36; --input: #1d1430;
        --row-line: #3a2a52; --row-hover: #33244a; --row-alt: #291c3a; --best-bg: #3a2450;
        --primary-grad: linear-gradient(135deg, #a855f7, #ff5fb0);
        --holo: linear-gradient(120deg, #3a2450, #4a2a68 35%, #5a2a58 65%, #3a2450);
        --unique: #e0a94a; --green: #59d97a; --bad: #ff8f9f;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: var(--font); color: var(--text); background: var(--page-bg); background-attachment: fixed;
        padding: 30px 24px 80px; -webkit-font-smoothing: antialiased; min-height: 100vh;
      }
      .head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
      .head h1 { font-family: var(--disp); font-size: 27px; font-weight: 800; color: #e0a8ff; text-shadow: 0 0 18px var(--glow); letter-spacing: .4px; }
      .head .kit { font-size: 27px; animation: wobble 3s ease-in-out infinite; display: inline-block; }
      @keyframes wobble { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg) scale(1.08); } }
      .hint { color: var(--muted); font-size: 13.5px; margin-bottom: 26px; }
      .hint b { color: var(--accent2); }

      /* 4 fixed columns: cards with .r2/.r3 span 2/3 of a row. Keeps the page
         readable at any capture width (no media queries), and grouped cards
         stay side by side. */
      .gallery { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 26px; align-items: start; }
      .card { display: flex; flex-direction: column; gap: 10px; }
      .card.r2 { grid-column: span 2; }
      .card.r3 { grid-column: span 3; }
      .card.r4 { grid-column: span 4; }
      .cap { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 700; color: #d9c0f5; }
      .cap .tag { font-size: 10px; font-weight: 800; letter-spacing: .5px; padding: 2px 8px; border-radius: 999px; background: var(--primary-grad); color: #fff; }

      .surface { border: 2px solid var(--win-border); border-radius: 18px; background: var(--win-bg); box-shadow: 0 24px 60px -26px #000, 0 0 30px -14px var(--glow); overflow: hidden; position: relative; }

      .bar { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 2px dashed var(--win-border); background: var(--panel-2); }
      .bar .title { font-family: var(--disp); font-weight: 800; font-size: 15px; letter-spacing: .3px; background: linear-gradient(90deg, #e0a8ff, #ff8fd0); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .bar .spacer { flex: 1; }
      .bar .pill { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--panel); border: 2px solid var(--win-border-soft); color: var(--text-soft); }
      .bar .ibtn { width: 26px; height: 26px; border-radius: 9px; display: grid; place-items: center; background: transparent; border: 2px solid transparent; color: var(--muted); font-size: 12px; }

      .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
      .dot.on { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 1.8s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .4; transform: scale(.72); } }

      .btn { height: 34px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--win-border-soft); background: var(--panel); color: var(--text); font: inherit; font-weight: 700; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
      .btn.primary { background: var(--primary-grad); border-color: transparent; color: #fff; box-shadow: 0 6px 16px -5px var(--glow-pink); }
      .input { background: var(--input); border: 2px solid var(--win-border-soft); border-radius: 999px; height: 34px; padding: 0 13px; color: var(--text); font: inherit; font-size: 12.5px; display: flex; align-items: center; gap: 7px; }
      .chip { font-size: 11px; font-weight: 700; padding: 4px 11px; border-radius: 999px; background: var(--panel); border: 2px solid var(--win-border-soft); color: var(--muted); }
      .chip.on { background: var(--primary-grad); border-color: transparent; color: #fff; }
      .label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted-2); }
      .k { background: var(--panel); border: 2px solid var(--win-border-soft); border-radius: 6px; padding: 1px 7px; color: var(--text-soft); font-weight: 700; font-size: 10.5px; }
      .spark { position: absolute; font-size: 12px; animation: twinkle 1.8s ease-in-out infinite; }
      @keyframes twinkle { 0%,100% { opacity: .15; transform: scale(.6) rotate(0); } 50% { opacity: 1; transform: scale(1.15) rotate(20deg); } }
      @keyframes beat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }

      /* ---------- price check ---------- */
      .item-head { display: flex; gap: 12px; padding: 14px; }
      .item-icon { width: 62px; height: 62px; flex: none; border-radius: 16px; display: grid; place-items: center; padding: 6px; font-size: 26px; background: var(--panel); border: 2px solid var(--win-border-soft); position: relative; }
      .item-icon img { width: 100%; height: 100%; object-fit: contain; display: block; filter: drop-shadow(0 3px 6px rgba(0,0,0,.5)); }
      .item-icon::after { content: "♡"; position: absolute; top: -8px; right: -8px; font-size: 14px; color: var(--accent); animation: beat 2s ease-in-out infinite; }
      .item-name { font-family: var(--disp); font-size: 18px; font-weight: 800; color: var(--unique); }
      .item-base { color: var(--muted); font-size: 12px; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
      .price-card { position: relative; overflow: hidden; margin: 0 14px 12px; border-radius: 16px; border: 2px solid var(--win-border-soft); background: var(--holo); background-size: 200% 200%; padding: 14px 15px; display: flex; align-items: center; gap: 15px; }
      .price-card .num { font-family: var(--disp); font-size: 32px; font-weight: 800; color: #fff; text-shadow: 0 2px 0 var(--accent2), 0 0 16px var(--glow); }
      .price-card .cur { font-weight: 700; font-size: 14px; color: var(--text-soft); }
      .price-sub { color: var(--text-soft); font-size: 11px; margin-top: 2px; }
      .price-div { width: 2px; align-self: stretch; background: var(--win-border-soft); border-radius: 2px; }
      .price-alt { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; color: var(--text-soft); font-weight: 600; }
      .price-alt b { color: var(--text); }
      .mods { padding: 0 14px 12px; display: flex; flex-direction: column; gap: 5px; }
      .mod { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-soft); }
      .tier { flex: none; font-size: 9.5px; font-weight: 800; padding: 2px 7px; border-radius: 8px; background: var(--primary-grad); color: #fff; }
      .tier.t2 { background: var(--accent2); }
      .val { color: var(--accent); font-weight: 700; }
      .star { color: var(--accent3); }
      .listings { border-top: 2px dashed var(--win-border); background: var(--panel-2); }
      .lrow { display: grid; grid-template-columns: 16px 94px 1fr 44px 50px; gap: 9px; padding: 8px 14px; align-items: center; border-bottom: 1px solid var(--row-line); position: relative; }
      .lrow .p { font-weight: 700; font-family: var(--disp); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
      .orb { width: 13px; height: 13px; border-radius: 50%; flex: none; background: radial-gradient(circle at 35% 30%, #fff6d8, #d9a441 55%, #7a5216); }
      .orb.ex { background: radial-gradient(circle at 35% 30%, #e6d4ff, #a06bff 55%, #4a2a80); }
      .lrow.best { background: linear-gradient(90deg, rgba(199,125,255,.16), var(--best-bg) 45%); }
      .lrow.best::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--primary-grad); }
      .lrow.best .p { color: var(--accent); }
      .seller { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .stock { color: var(--muted); text-align: center; }
      .age { color: var(--muted-2); text-align: right; font-size: 11px; }
      .foot { display: flex; align-items: center; gap: 6px; padding: 8px 14px; color: var(--muted); font-size: 10.5px; font-weight: 600; }

      /* ---------- quick actions ---------- */
      .actions { display: flex; flex-wrap: wrap; gap: 7px; padding: 0 14px 13px; }
      .actions .btn { height: 31px; font-size: 11.5px; padding: 0 11px; }
      .preview { margin: 0 14px 13px; border: 2px dashed var(--win-border); border-radius: 13px; background: var(--input); padding: 10px 12px; font-family: var(--mono); font-size: 11px; color: var(--text-soft); line-height: 1.5; }
      .preview .lbl { font-family: var(--font); font-size: 9.5px; font-weight: 800; letter-spacing: 1.1px; text-transform: uppercase; color: var(--muted-2); margin-bottom: 5px; }

      /* ---------- item check / danger ---------- */
      .pad { padding: 13px; display: flex; flex-direction: column; gap: 10px; }
      .danger { display: flex; align-items: center; gap: 13px; padding: 13px 15px; border-radius: 15px; border: 2px solid var(--win-border-soft); background: var(--holo); }
      .danger .score { font-family: var(--disp); font-size: 34px; font-weight: 800; line-height: 1; color: #fff; text-shadow: 0 0 16px var(--glow); }
      .danger .score small { display: block; font-family: var(--font); font-size: 9px; letter-spacing: 1.2px; color: var(--muted); font-weight: 800; }
      .danger .txt { flex: 1; }
      .danger .txt b { font-family: var(--disp); font-size: 15px; color: var(--accent3); }
      .danger .txt div { color: var(--muted); font-size: 11.5px; }
      .meter { height: 10px; border-radius: 999px; background: var(--input); border: 2px solid var(--win-border-soft); overflow: hidden; }
      .meter i { display: block; height: 100%; width: 62%; background: linear-gradient(90deg, #59d97a, #ffd166 55%, #ff5fb0); border-radius: 999px; }
      .kv { display: flex; justify-content: space-between; font-size: 12.5px; padding: 7px 0; border-bottom: 1px solid var(--row-line); }
      .kv span { color: var(--muted); }
      .kv b { color: var(--text); }

      /* ---------- stash search ---------- */
      .presets { display: flex; gap: 6px; padding: 11px 13px 6px; }
      .filter { display: grid; grid-template-columns: 22px 1fr 110px 58px; gap: 9px; align-items: center; padding: 9px 13px; border-bottom: 1px solid var(--row-line); }
      .cbox { width: 18px; height: 18px; border-radius: 6px; border: 2px solid var(--win-border-soft); display: grid; place-items: center; font-size: 10px; color: #fff; }
      .cbox.on { background: var(--primary-grad); border-color: transparent; }
      .ftext { font-size: 12.5px; color: var(--text-soft); }
      .slider { height: 6px; border-radius: 999px; background: var(--input); position: relative; }
      .slider::before { content: ""; position: absolute; left: 18%; right: 22%; top: 0; bottom: 0; background: var(--primary-grad); border-radius: 999px; }
      .slider i { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: #fff; transform: translate(-50%,-50%); box-shadow: 0 0 8px var(--glow); }
      .numin { display: flex; gap: 4px; }
      .numin span { flex: 1; text-align: center; background: var(--input); border: 2px solid var(--win-border-soft); border-radius: 8px; font-size: 11px; padding: 3px 0; color: var(--text-soft); font-family: var(--mono); }

      /* ---------- images / notes ---------- */
      .imgstrip { display: flex; gap: 8px; padding: 13px; overflow: hidden; }
      .imgstrip .ph { flex: none; width: 132px; height: 92px; border-radius: 12px; border: 2px solid var(--win-border-soft); background: var(--input); display: grid; place-items: center; color: var(--muted-2); font-size: 21px; }
      .imgstrip .ph.hot { border-color: var(--accent); box-shadow: 0 0 18px -6px var(--glow-pink); }
      .notes { padding: 13px; display: flex; flex-direction: column; gap: 9px; }
      .notes .line { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--text-soft); }
      .notes .line b { color: var(--accent3); }

      /* ---------- session hud ---------- */
      .hud { display: flex; flex-wrap: wrap; gap: 9px; padding: 13px; }
      .stat { flex: 1 1 88px; background: var(--panel); border: 2px solid var(--win-border-soft); border-radius: 13px; padding: 9px 11px; }
      .stat .lb { font-size: 9px; font-weight: 800; letter-spacing: 1.1px; text-transform: uppercase; color: var(--muted-2); }
      .stat .vl { font-family: var(--disp); font-size: 20px; font-weight: 800; color: #fff; }
      .stat .vl small { font-family: var(--font); font-size: 10.5px; color: var(--muted); font-weight: 600; }
      .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--primary-grad); color: #fff; }
      .badge.good { background: linear-gradient(135deg, #2f9e5e, #59d97a); }

      /* ---------- companion / analytics ---------- */
      .ctabs { display: flex; gap: 8px; padding: 12px 13px 0; }
      .ctab { font: inherit; font-size: 12px; font-weight: 700; color: var(--muted); background: var(--panel); border: 2px solid var(--win-border-soft); border-radius: 999px; padding: 5px 15px; }
      .ctab.on { color: #fff; background: var(--primary-grad); border-color: transparent; }
      .analytics { padding: 13px; display: flex; flex-direction: column; gap: 8px; }
      .hbar { display: grid; grid-template-columns: 1fr auto; gap: 6px; font-size: 12px; color: var(--text-soft); }
      .hbar .tr { grid-column: 1 / -1; height: 8px; border-radius: 999px; background: var(--input); overflow: hidden; }
      .hbar .fl { height: 100%; border-radius: 999px; background: var(--primary-grad); }
      .heat { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; padding: 13px; }
      .heat i { aspect-ratio: 1; border-radius: 3px; background: rgba(255,255,255,.06); }
      .heat i.a1 { background: rgba(168,85,247,.35); }
      .heat i.a2 { background: rgba(168,85,247,.6); }
      .heat i.a3 { background: rgba(255,95,176,.85); }

      /* ---------- settings ---------- */
      .set-body { display: flex; min-height: 320px; }
      .sidebar { width: 160px; flex: none; border-right: 2px dashed var(--win-border); padding: 10px 8px; display: flex; flex-direction: column; gap: 3px; }
      .smitem { text-align: left; font: inherit; font-size: 12.5px; font-weight: 600; color: var(--muted); background: transparent; border: 2px solid transparent; border-radius: 11px; padding: 8px 11px; }
      .smitem.active { color: #fff; background: var(--primary-grad); box-shadow: 0 4px 12px -4px var(--glow-pink); }
      .smitem.quit { margin-top: auto; color: #ff8fb0; border-color: var(--win-border-soft); }
      .content { flex: 1; padding: 16px 18px; display: flex; flex-direction: column; gap: 13px; }
      .content h3 { font-family: var(--disp); font-size: 16px; color: var(--text); }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--row-line); }
      .row .rt { font-size: 12.5px; }
      .row .rt small { display: block; color: var(--muted); font-size: 10.5px; }
      .sw-toggle { width: 44px; height: 24px; border-radius: 999px; background: var(--input); border: 2px solid var(--win-border-soft); position: relative; flex: none; }
      .sw-toggle i { position: absolute; top: 1px; left: 1px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); }
      .sw-toggle.on { background: var(--primary-grad); border-color: transparent; }
      .sw-toggle.on i { left: 21px; background: #fff; }

      /* ---------- notifications ---------- */
      .toasts { padding: 13px; display: flex; flex-direction: column; gap: 9px; }
      .toast { display: flex; align-items: center; gap: 11px; border: 2px solid var(--win-border-soft); border-radius: 14px; background: var(--panel); padding: 10px 12px; box-shadow: 0 10px 26px -12px #000; }
      .toast .ic { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: var(--primary-grad); font-size: 14px; flex: none; }
      .toast .tt { flex: 1; }
      .toast .tt b { display: block; font-size: 12.5px; color: var(--text); }
      .toast .tt small { color: var(--muted); font-size: 11px; }
      .toast.ok .ic { background: linear-gradient(135deg, #2f9e5e, #59d97a); }
      .toast.bad .ic { background: linear-gradient(135deg, #b03050, #ff5fb0); }

      /* ---------- wheel ---------- */
      .wheel { display: flex; gap: 12px; padding: 15px; flex-wrap: wrap; }
      .tool { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 2px solid var(--win-border-soft); border-radius: 14px; padding: 9px 13px; font-size: 12.5px; font-weight: 700; color: var(--text); }
      .tool .ic { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--primary-grad); font-size: 13px; }
      .tool.on { border-color: var(--accent); box-shadow: 0 0 16px -6px var(--glow-pink); }
    </style>
  </head>
  <body>
    <div class="head"><span class="kit">🎀</span><h1>POE Kitten · Tool Showcase</h1></div>
    <div class="hint">
      Everything POE Kitten does, in <b>Kuromi Mode</b>. Motion is expressive — sparkles, bobs, holo shine &amp; beating badges.
    </div>

    <div class="gallery">
      <!-- 01 PRICE CHECK -->
      <figure class="card r2">
        <figcaption class="cap"><span class="tag">01</span> Price Check — hover an item, press your key</figcaption>
        <div class="surface">
          <span class="spark" style="top: 62px; right: 22px">✨</span>
          <div class="bar">
            <div class="title">✦ Price Check</div>
            <div class="spacer"></div>
            <div class="pill"><span class="dot on"></span>&nbsp;Dawn of the Hunt ▾</div>
            <div class="pill" style="color:#fff;background:var(--primary-grad);border-color:transparent">1 div = 214 ex</div>
            <div class="ibtn">⚙</div><div class="ibtn">✕</div>
          </div>
          <div class="item-head">
            <div class="item-icon"><img src="https://web.poecdn.com/gen/image/WzksMTQseyJmIjoiMkRJdGVtcy9GbGFza3MvVW5pcXVlcy9NZWx0aW5nTWFlbHN0cm9tIiwidyI6MSwiaCI6Miwic2NhbGUiOjEsInJlYWxtIjoicG9lMiIsImxldmVsIjoxfV0/3ffec91606/MeltingMaelstrom.png" alt="Melting Maelstrom" /></div>
            <div>
              <div class="item-name">Melting Maelstrom</div>
              <div class="item-base">Ultimate Mana Flask · iLvl 82</div>
              <div class="chips"><span class="chip on">Unique ♡</span><span class="chip">Quality +20%</span><span class="chip">Corrupted</span></div>
            </div>
          </div>
          <div class="price-card">
            <div>
              <div style="display:flex;align-items:baseline;gap:7px"><span class="num">3.2</span><span class="cur">Divine Orb</span></div>
              <div class="price-sub">Median of 24 listings · updated just now</div>
            </div>
            <div class="price-div"></div>
            <div class="price-alt"><div>≈ <b>685</b> Exalted</div><div>≈ <b>12.4</b> Chaos</div><div style="color:var(--green)">▼ 4.1% vs 7d</div></div>
          </div>
          <div class="mods">
            <div class="mod"><span class="star">★</span><span class="tier">T1</span> Recover <span class="val">25%</span> of Mana when used</div>
            <div class="mod"><span class="star">★</span><span class="tier t2">T2</span> <span class="val">+34%</span> to Mana Recovery Rate</div>
          </div>
          <div class="listings">
            <div class="lrow best">
              <div class="star">★</div>
              <div class="p"><span class="orb"></span>2.9 div</div>
              <div class="seller">Exile_Vaal</div>
              <div class="stock">1</div><div class="age">6m</div>
            </div>
            <div class="lrow"><div></div><div class="p"><span class="orb"></span>3.1 div</div><div class="seller">ChaosGambler</div><div class="stock">2</div><div class="age">22m</div></div>
            <div class="lrow"><div></div><div class="p"><span class="orb ex"></span>672 ex</div><div class="seller">WraeclastWind</div><div class="stock">1</div><div class="age">51m</div></div>
          </div>
          <div class="foot"><span class="k">Ctrl</span>+<span class="k">F6</span> check hovered item<span style="flex:1"></span><span style="color:var(--accent)">⚡ 0.8s</span></div>
        </div>
      </figure>

      <!-- 02 QUICK ACTIONS -->
      <figure class="card">
        <figcaption class="cap"><span class="tag">02</span> Quick actions &amp; whisper composer</figcaption>
        <div class="surface">
          <div class="bar"><div class="title">💬 Trade</div><div class="spacer"></div><span class="pill">1 div = 214 ex</span></div>
          <div style="padding:13px 14px 10px" class="label">Offer for 3.2 Divine</div>
          <div class="actions">
            <button class="btn primary">2.9 div <small style="opacity:.75">-10%</small></button>
            <button class="btn">672 ex <small style="opacity:.75">cross-currency</small></button>
            <button class="btn">3.2 div <small style="opacity:.75">full price</small></button>
          </div>
          <div class="actions" style="padding-top:0">
            <button class="btn">🔔 Whisper</button>
            <button class="btn">📋 Copy</button>
            <button class="btn">🏠 Visit hideout</button>
            <button class="btn">✕ Ignore</button>
          </div>
          <div class="preview">
            <div class="lbl">Message preview — manner ♡</div>
            Hi, I would like to buy your Melting Maelstrom listed for 2.9 divine in Dawn of the Hunt. ♡
          </div>
        </div>
      </figure>

      <!-- 03 ITEM CHECK / DANGER -->
      <figure class="card">
        <figcaption class="cap"><span class="tag">03</span> Item check — waystone value &amp; danger score</figcaption>
        <div class="surface">
          <div class="bar"><div class="title">🗺 Item Check</div><div class="spacer"></div><span class="pill">T15</span></div>
          <div class="pad">
            <div class="danger">
              <div class="score">62<small>DANGER</small></div>
              <div class="txt">
                <b>Risky — bring a freeze charm</b>
                <div>3 damage mods · 1 reflect · no regen</div>
              </div>
            </div>
            <div class="meter"><i></i></div>
            <div class="kv"><span>Waystone value</span><b style="color:var(--accent)">≈ 4.1 div</b></div>
            <div class="kv"><span>Quantity / Rarity / Pack</span><b>+71% / +38% / +24%</b></div>
            <div class="kv"><span>Monster damage</span><b style="color:var(--bad)">+52% · +31% as extra fire</b></div>
          </div>
        </div>
      </figure>

      <!-- 04 STASH SEARCH -->
      <figure class="card r3">
        <figcaption class="cap"><span class="tag">04</span> Stash search — map rolling &amp; dump sorting</figcaption>
        <div class="surface">
          <div class="bar"><div class="title">📦 Stash Search</div><div class="spacer"></div><span class="pill">Preset 1 / 3</span><span class="pill">180 matches</span></div>
          <div class="presets"><span class="chip on">Map rolling</span><span class="chip">Dump sort</span><span class="chip">Currency</span><span class="chip">Fragments</span></div>
          <div class="filter">
            <div class="cbox on">✓</div>
            <div class="ftext"><span class="tier">T1</span>+#% to Quantity of Items found</div>
            <div class="slider"><i style="left:60%"></i></div>
            <div class="numin"><span>65</span><span>80</span></div>
          </div>
          <div class="filter">
            <div class="cbox on">✓</div>
            <div class="ftext"><span class="tier t2">T2</span>#% increased Monster Pack Size</div>
            <div class="slider"><i style="left:42%"></i></div>
            <div class="numin"><span>20</span><span>30</span></div>
          </div>
          <div class="filter">
            <div class="cbox">✓</div>
            <div class="ftext"><span class="tier">T1</span>Map Tier equals 15</div>
            <div class="slider"><i style="left:80%"></i></div>
            <div class="numin"><span>15</span><span>15</span></div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:11px 13px">
            <span style="color:var(--muted);font-size:11.5px">Matches are highlighted in your stash</span>
            <button class="btn primary">🔍 Highlight</button>
          </div>
        </div>
      </figure>

      <!-- 05 CHEAT SHEETS -->
      <figure class="card">
        <figcaption class="cap"><span class="tag">05</span> Cheat sheets — pin reference images</figcaption>
        <div class="surface">
          <div class="bar"><div class="title">🖼 Cheat sheets</div><div class="spacer"></div><div class="ibtn">＋</div></div>
          <div class="imgstrip">
            <div class="ph hot">🖼</div>
            <div class="ph">🖼</div>
            <div class="ph">🖼</div>
          </div>
          <div style="padding:0 13px 13px;color:var(--muted);font-size:11.5px">
            Scroll to cycle · hold the key to peek · images stay pinned over the game.
          </div>
        </div>
      </figure>

      <!-- 06 NOTEPAD -->
      <figure class="card">
        <figcaption class="cap"><span class="tag">06</span> Notepad</figcaption>
        <div class="surface">
          <div class="bar"><div class="title">📝 Notepad</div><div class="spacer"></div><span class="pill">saved</span></div>
          <div class="notes">
            <div class="line">◆ <span>Sell <b>2× Divine</b> for the new wand</span></div>
            <div class="line">◆ <span>Respec into <b>+max res</b> before next boss</span></div>
            <div class="line">◆ <span>Kiara — <b>trade at 8pm</b></span></div>
          </div>
        </div>
      </figure>

      <!-- 07 SESSION HUD -->
      <figure class="card r2">
        <figcaption class="cap"><span class="tag">07</span> Session HUD — always visible, even with the overlay closed</figcaption>
        <div class="surface">
          <div class="bar"><div class="title">⏱ Session</div><div class="spacer"></div><span class="badge">▲ Level 72</span></div>
          <div class="hud">
            <div class="stat"><div class="lb">Playtime</div><div class="vl">2h 14m</div></div>
            <div class="stat"><div class="lb">Area</div><div class="vl" style="font-size:15px">Dunes <small>6m 12s</small></div></div>
            <div class="stat"><div class="lb">Zones run</div><div class="vl">23</div></div>
            <div class="stat"><div class="lb">Deaths</div><div class="vl" style="color:var(--bad)">2</div></div>
            <div class="stat"><div class="lb">Level pace</div><div class="vl">1.2 <small>/h</small></div></div>
            <div class="stat"><div class="lb">XP gain</div><div class="vl" style="color:var(--green)">100%</div></div>
          </div>
        </div>
      </figure>

      <!-- 08 TOASTS -->
      <figure class="card">
        <figcaption class="cap"><span class="tag">08</span> Notifications — whispers, deaths, level-ups</figcaption>
        <div class="surface">
          <div class="bar"><div class="title">🔔 Alerts</div><div class="spacer"></div><span class="pill">TTS + Discord</span></div>
          <div class="toasts">
            <div class="toast">
              <div class="ic">💬</div>
              <div class="tt"><b>Buyer: HandsySorcy</b><small>Melting Maelstrom — 2.9 divine</small></div>
              <button class="btn" style="height:28px;font-size:11px">Copy /invite</button>
            </div>
            <div class="toast bad">
              <div class="ic">☠</div>
              <div class="tt"><b>You died</b><small>Dunes · T15 · level 72</small></div>
            </div>
            <div class="toast ok">
              <div class="ic">▲</div>
              <div class="tt"><b>Level up — 72</b><small>1h 48m since last level</small></div>
            </div>
          </div>
        </div>
      </figure>

      <!-- 09 TRADE COPILOT -->
      <figure class="card">
        <figcaption class="cap"><span class="tag">09</span> Trade Copilot — whisper queue</figcaption>
        <div class="surface">
          <div class="bar"><div class="title">🤝 Buyers</div><div class="spacer"></div><span class="pill">auto-reply on</span></div>
          <div class="toasts" style="gap:7px">
            <div class="toast" style="padding:8px 11px"><div class="ic" style="width:26px;height:26px;font-size:12px">1</div><div class="tt"><b>HandsySorcy</b><small>2.9 div · invited</small></div><span class="chip on">Invited</span></div>
            <div class="toast" style="padding:8px 11px"><div class="ic" style="width:26px;height:26px;font-size:12px">2</div><div class="tt"><b>ChaosGambler</b><small>3.1 div · waiting</small></div><button class="btn primary" style="height:27px;font-size:11px">Invite</button></div>
            <div class="toast" style="padding:8px 11px;opacity:.65"><div class="ic" style="width:26px;height:26px;font-size:12px">3</div><div class="tt"><b>WraeclastWind</b><small>672 ex · sold</small></div><span class="chip">Gone</span></div>
          </div>
        </div>
      </figure>

      <!-- 10 COMPANION / ANALYTICS -->
      <figure class="card r2">
        <figcaption class="cap"><span class="tag">10</span> Companion dashboard — live stats &amp; analytics in your browser</figcaption>
        <div class="surface">
          <div class="bar"><div class="title">📊 Companion</div><div class="spacer"></div><span class="pill">127.0.0.1:8584/companion</span></div>
          <div class="ctabs"><span class="ctab on">Live</span><span class="ctab">Analytics</span></div>
          <div style="padding:13px 13px 0" class="label">Most checked items</div>
          <div class="analytics">
            <div class="hbar"><span>Melting Maelstrom</span><span>48</span><span class="tr"><span class="fl" style="width:100%"></span></span></div>
            <div class="hbar"><span>Attuned Wand</span><span>31</span><span class="tr"><span class="fl" style="width:65%"></span></span></div>
            <div class="hbar"><span>Sapphire Ring</span><span>19</span><span class="tr"><span class="fl" style="width:40%"></span></span></div>
          </div>
          <div style="padding:6px 13px 0" class="label">Activity heatmap — 7 days × 24h</div>
          <div class="heat">
            <i class="a1"></i><i></i><i></i><i class="a1"></i><i class="a2"></i><i class="a3"></i><i class="a2"></i><i class="a1"></i><i></i><i></i><i class="a1"></i><i class="a2"></i>
            <i class="a3"></i><i class="a2"></i><i class="a1"></i><i></i><i></i><i class="a1"></i><i class="a2"></i><i class="a2"></i><i class="a1"></i><i></i><i></i><i></i>
            <i></i><i class="a1"></i><i class="a2"></i><i class="a3"></i><i class="a2"></i><i class="a1"></i><i></i><i></i><i class="a1"></i><i class="a1"></i><i class="a2"></i><i class="a3"></i>
            <i class="a2"></i><i class="a1"></i><i></i><i></i><i class="a1"></i><i class="a2"></i><i class="a3"></i><i class="a2"></i><i class="a1"></i><i></i><i></i><i class="a1"></i>
            <i class="a2"></i><i class="a3"></i><i class="a2"></i><i class="a1"></i><i></i><i></i><i class="a1"></i><i class="a2"></i><i class="a2"></i><i class="a1"></i><i></i><i></i>
            <i></i><i class="a1"></i><i class="a2"></i><i class="a3"></i><i class="a3"></i><i class="a2"></i><i class="a1"></i><i></i><i></i><i class="a1"></i><i class="a1"></i><i class="a2"></i>
            <i class="a1"></i><i></i><i></i><i class="a1"></i><i class="a2"></i><i class="a2"></i><i class="a3"></i><i class="a2"></i><i class="a1"></i><i></i><i></i><i></i>
          </div>
        </div>
      </figure>

      <!-- 11 SETTINGS -->
      <figure class="card r2">
        <figcaption class="cap"><span class="tag">11</span> Settings — built into the dashboard</figcaption>
        <div class="surface">
          <div class="bar"><div class="title">⚙ Settings</div><div class="spacer"></div><div class="ibtn">✕</div></div>
          <div class="set-body">
            <div class="sidebar">
              <button class="smitem active">⌨ Hotkeys</button>
              <button class="smitem">💬 Chat &amp; alerts</button>
              <button class="smitem">🧩 General</button>
              <button class="smitem">💰 Price check</button>
              <button class="smitem">🗺 Item check</button>
              <button class="smitem active" style="background:transparent;color:var(--muted);box-shadow:none">🎀 About</button>
              <button class="smitem quit">⏻ Quit</button>
            </div>
            <div class="content">
              <h3>Chat &amp; alerts 💬</h3>
              <div class="row"><div class="rt">Read client log<small>Needed for whispers, deaths and level-ups</small></div><div class="sw-toggle on"><i></i></div></div>
              <div class="row"><div class="rt">Toast notifications<small>Pop-ups for whispers and level-ups</small></div><div class="sw-toggle on"><i></i></div></div>
              <div class="row"><div class="rt">Text to speech<small>Read trade whispers out loud</small></div><div class="sw-toggle on"><i></i></div></div>
              <div class="row"><div class="rt">Discord webhook<small>Forward whispers to a channel</small></div><div class="sw-toggle"><i></i></div></div>
            </div>
          </div>
        </div>
      </figure>

      <!-- 12 WHEEL -->
      <figure class="card">
        <figcaption class="cap"><span class="tag">12</span> Dashboard — pick a tool</figcaption>
        <div class="surface">
          <div class="bar"><div class="title">🎀 Dashboard</div><div class="spacer"></div><span class="pill">Shift + Space</span></div>
          <div class="wheel">
            <div class="tool on"><span class="ic">💰</span>Price check</div>
            <div class="tool"><span class="ic">🗺</span>Item check</div>
            <div class="tool"><span class="ic">📦</span>Stash search</div>
            <div class="tool"><span class="ic">🖼</span>Cheat sheets</div>
            <div class="tool"><span class="ic">📝</span>Notepad</div>
            <div class="tool"><span class="ic">⏱</span>Session HUD</div>
            <div class="tool"><span class="ic">⚙</span>Settings</div>
          </div>
        </div>
      </figure>
    </div>
  </body>
