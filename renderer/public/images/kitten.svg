<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7" />
      <stop offset="1" stop-color="#ff5fb0" />
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2f6a" />
      <stop offset="1" stop-color="#2a1c3f" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bg)" />

  <!-- ears -->
  <path d="M150 212 L106 84 L248 150 Z" fill="url(#fur)" stroke="#7a3fb0" stroke-width="9" stroke-linejoin="round" />
  <path d="M362 212 L406 84 L264 150 Z" fill="url(#fur)" stroke="#7a3fb0" stroke-width="9" stroke-linejoin="round" />
  <path d="M160 198 L134 116 L226 158 Z" fill="#ff8fce" />
  <path d="M352 198 L378 116 L286 158 Z" fill="#ff8fce" />

  <!-- head -->
  <ellipse cx="256" cy="288" rx="164" ry="150" fill="url(#fur)" stroke="#7a3fb0" stroke-width="9" />

  <!-- blush -->
  <ellipse cx="150" cy="334" rx="30" ry="18" fill="#ff5fb0" opacity="0.45" />
  <ellipse cx="362" cy="334" rx="30" ry="18" fill="#ff5fb0" opacity="0.45" />

  <!-- eyes -->
  <ellipse cx="200" cy="274" rx="27" ry="35" fill="#fff" />
  <ellipse cx="312" cy="274" rx="27" ry="35" fill="#fff" />
  <ellipse cx="200" cy="280" rx="15" ry="23" fill="#241a2e" />
  <ellipse cx="312" cy="280" rx="15" ry="23" fill="#241a2e" />
  <circle cx="208" cy="268" r="6.5" fill="#fff" />
  <circle cx="320" cy="268" r="6.5" fill="#fff" />

  <!-- nose + mouth -->
  <path d="M256 318 l16 14 l-32 0 Z" fill="#ff8fce" />
  <path d="M256 336 q-18 26 -40 4" fill="none" stroke="#ffd0e8" stroke-width="7" stroke-linecap="round" />
  <path d="M256 336 q18 26 40 4" fill="none" stroke="#ffd0e8" stroke-width="7" stroke-linecap="round" />

  <!-- whiskers -->
  <g stroke="#c9a8e8" stroke-width="6" stroke-linecap="round">
    <path d="M96 300 L40 284" />
    <path d="M96 324 L36 324" />
    <path d="M416 300 L472 284" />
    <path d="M416 324 L476 324" />
  </g>

  <!-- bow -->
  <g transform="translate(398,116)">
    <path d="M0 0 L-46 -26 L-46 26 Z" fill="#ff5fb0" stroke="#fff" stroke-width="5" stroke-linejoin="round" />
    <path d="M0 0 L46 -26 L46 26 Z" fill="#ff5fb0" stroke="#fff" stroke-width="5" stroke-linejoin="round" />
    <circle cx="0" cy="0" r="13" fill="#ff8fce" stroke="#fff" stroke-width="5" />
  </g>

  <!-- sparkle -->
  <path d="M118 150 l7 18 l18 7 l-18 7 l-7 18 l-7 -18 l-18 -7 l18 -7 Z" fill="#fff" opacity="0.85" />
</svg>
