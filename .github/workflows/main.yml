name: Build & Release

on:
  push:
    branches:
      - master
    # Allow version tags through: a tag run builds every platform, uploads to a
    # draft release, then publishes it. Branch pushes build only.
    tags:
      - "v*"
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
        working-directory: ./renderer
      - run: npm run make-index-files
        working-directory: ./renderer
      - run: npm run lint
        working-directory: ./renderer
      - run: npm run build
        working-directory: ./renderer
      - uses: actions/upload-artifact@v7
        with:
          name: renderer-dist
          path: ./renderer/dist
          retention-days: 1

  package:
    needs: renderer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            flags: "--win"
            manifest: latest.yml
          - os: ubuntu-22.04
            flags: "--linux"
            manifest: latest-linux.yml
          - os: macos-14
            flags: "--mac"
            manifest: latest-mac.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: renderer-dist
          path: ./renderer/dist
      - run: npm ci
        working-directory: ./main
      - run: npm run build
        working-directory: ./main

      # Build only (no publish). On tag runs we publish in a second pass so the
      # release is created once with every platform's artifacts attached.
      - name: Package (no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.release != true }}
        run: npm run package -- --publish never --config.win.signAndEditExecutable=true ${{ matrix.flags }}
        working-directory: ./main

      # Tag runs: publish artifacts to the existing draft release, but do NOT
      # let electron-builder create/publish the release itself — otherwise the
      # first platform to finish would publish an incomplete release.
      - name: Package (publish draft)
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release == true }}
        run: npm run package -- --publish always --config.publish.releaseType=draft --config.win.signAndEditExecutable=true ${{ matrix.flags }}
        working-directory: ./main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show update manifest
        shell: bash
        run: cat ./main/dist/${{ matrix.manifest }}

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: |
            ./main/dist/${{ matrix.manifest }}
            ./main/dist/*.exe
            ./main/dist/*.AppImage
            ./main/dist/*.dmg
          retention-days: 7
          if-no-files-found: warn

  # Runs once every platform has finished uploading to the draft release.
  publish-release:
    needs: package
    if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --repo "${{ github.repository }}"
