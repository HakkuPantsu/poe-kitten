on:
  push:
    branches:
      - "master"
      - "dev"
  pull_request:
    branches:
      - master
      - dev

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v6
      - run: npm ci
        working-directory: ./renderer
      - run: npm ci
        working-directory: ./main
      - uses: pre-commit/action@v3.0.1

  # NOTE: the `test` job was removed — the renderer has no `test` script, so
  # `npm run test` fails. Re-add it once real tests exist.
